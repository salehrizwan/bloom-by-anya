  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#D8C8A5" stroke-width="1.5" stroke-opacity="0.5" rx="16" />
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#D8C8A5" stroke-width="0.75" stroke-opacity="0.3" rx="12" />
  
  <!-- Central Botanical Emblem -->
  <g transform="translate(400, 260)">
