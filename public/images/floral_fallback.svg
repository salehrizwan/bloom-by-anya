      <stop offset="100%" stop-color="#F7F1E7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8C8A5" />
      <stop offset="100%" stop-color="#BFA56E" />
