    <circle r="68" fill="none" stroke="#788269" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
    
    <!-- Flower icon -->
    <path d="M0 -35 C12 -20 12 -10 0 0 C-12 -10 -12 -20 0 -35 Z" fill="#DDA9AC" opacity="0.85" />
