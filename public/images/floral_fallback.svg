      <stop offset="0%" stop-color="#FBF8F1" />
      <stop offset="100%" stop-color="#F7F1E7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8C8A5" />
      <stop offset="100%" stop-color="#BFA56E" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#D8C8A5" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  
  <g transform="translate(400, 260)" text-anchor="middle">
