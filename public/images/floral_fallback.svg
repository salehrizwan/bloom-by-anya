    <path d="M-35 0 C-20 12 -10 12 0 0 C-10 -12 -20 -12 -35 0 Z" fill="#D99B20" opacity="0.8" />
    <path d="M35 0 C20 12 10 12 0 0 C10 -12 20 -12 35 0 Z" fill="#D99B20" opacity="0.8" />
    <circle r="12" fill="#303A2B" />
    <circle r="5" fill="#D8C8A5" />
    
    <!-- Text -->
